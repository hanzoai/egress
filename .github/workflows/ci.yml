name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: hanzo-build-linux-amd64
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go build ./...
      - run: go vet ./...

      # -race because the credential cache is read by every in-flight call and
      # rewritten by the refresh, which is the one place a data race would hand
      # two callers each other's key.
      - run: go test -race ./...
