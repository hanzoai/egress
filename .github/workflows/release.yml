name: Release

# A semver tag publishes one static linux/amd64 binary and its checksum.
#
# No container image. Egress runs as one process under systemd on a host we
# provision, so nothing in the estate would pull one -- an image would add a
# registry credential and a container runtime to the box holding every provider
# key, for no consumer. amd64 only, for the same reason: it is the host it runs
# on.
#
# The upload talks to the forge's own API, which is based at /v1 -- NOT
# /api/v1, which 404s and reads exactly like the API being switched off. The
# GitHub release actions are not usable here: they target api.github.com, and
# this is not GitHub.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: [linux-amd64]
    env:
      GOWORK: off
      # Runners are in-cluster, so reach the forge by Service rather than back
      # out through the SSO proxy that fronts git.hanzo.ai.
      FORGE: http://hanzo-git.hanzo.svc/v1

      # github.com/hanzoai/kms is a private repo, so go-mod cannot read its
      # go.mod anonymously and says so as `could not read Username for
      # 'https://github.com': terminal prompts disabled` -- which reads like a
      # prompt problem and is a permission one. Every tag after v0.1.1 failed
      # here and published no binary, because the pin moved from a version the
      # public proxy had cached to one that exists only in the private repo.
      #
      # GOPRIVATE names that ONE module rather than github.com/hanzoai/*: every
      # other dependency then keeps resolving through the proxy with
      # sum.golang.org authoritative, and only the module that must be fetched
      # direct is fetched direct.
      GOPRIVATE: github.com/hanzoai/kms
      # The token reaches git as process environment, so the build writes no
      # credential to the runner's disk -- the runner is shared, and a
      # ~/.gitconfig outlives the job that wrote it. Same mechanism as visor's
      # build.sh, which is where this pattern already works.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GH_PAT }}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The artifact ships only if the suite guarding the credential passes.
      - run: go test -race -count=1 ./...

      - name: Resolve version
        id: version
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o dist/egress-linux-amd64 ./cmd/egress
          (cd dist && sha256sum egress-linux-amd64 > egress-linux-amd64.sha256)

      # Publishing is four named steps rather than one. Task logs on this forge
      # are zstd blobs in S3 and awkward to read, but step NAMES and their
      # statuses are queryable -- so a failure says which call broke without
      # anyone opening a log.

      - name: Resolve the release id
        id: rel
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth="Authorization: token $TOKEN"

          # An annotated tag already has a release row here, so this normally
          # finds one and the POST never runs. Parse with jq: `"id"` appears
          # several times in the object (the author carries one too) and a
          # greedy sed takes the LAST, which silently yields a valid-looking
          # number for the wrong release. The upload then 404s far from here.
          body=$(curl -sf -H "$auth" "$FORGE/repos/$REPO/releases/tags/$TAG" || true)
          id=$(printf '%s' "$body" | jq -er '.id' 2>/dev/null || true)

          if [ -z "$id" ] || [ "$id" = "null" ]; then
            id=$(curl -sf -X POST -H "$auth" -H 'Content-Type: application/json' \
                   -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" \
                   "$FORGE/repos/$REPO/releases" | jq -er '.id')
          fi
          [ -n "$id" ] && [ "$id" != "null" ]
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Upload the binary
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ steps.rel.outputs.id }}
        run: |
          set -euo pipefail
          curl -sf -X POST -H "Authorization: token $TOKEN" \
            -F "attachment=@dist/egress-linux-amd64" \
            "$FORGE/repos/$REPO/releases/$ID/assets?name=egress-linux-amd64" >/dev/null

      - name: Upload the checksum
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ steps.rel.outputs.id }}
        run: |
          set -euo pipefail
          curl -sf -X POST -H "Authorization: token $TOKEN" \
            -F "attachment=@dist/egress-linux-amd64.sha256" \
            "$FORGE/repos/$REPO/releases/$ID/assets?name=egress-linux-amd64.sha256" >/dev/null

      - name: Verify the assets attached
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ steps.rel.outputs.id }}
        run: |
          set -euo pipefail
          # A release carrying no binary is the failure this exists to catch,
          # and it looks identical to a good one from the release page.
          n=$(curl -sf -H "Authorization: token $TOKEN" \
                "$FORGE/repos/$REPO/releases/$ID" \
              | jq -r '[.assets[]?.name] | length')
          [ "${n:-0}" -ge 2 ]
