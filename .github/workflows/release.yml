name: Release

# A semver tag produces one thing: a static linux/amd64 binary and its checksum.
#
# No container image. Egress runs as one process under systemd on a host we
# provision, so nothing in the estate would pull an image — publishing one would
# add a registry credential and a container runtime to the box holding every
# provider key, to be consumed by nobody.
#
# amd64 only, on our own runner, for the same reason: that is the host it runs
# on, and a second architecture nothing deploys is a second thing to keep green.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: hanzo-build-linux-amd64
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The artifact ships only if the suite that guards the credential passes.
      - run: go test -race ./...

      - name: Resolve version
        id: version
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o dist/egress-linux-amd64 ./cmd/egress
          (cd dist && sha256sum egress-linux-amd64 > egress-linux-amd64.sha256)

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/egress-linux-amd64
            dist/egress-linux-amd64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
